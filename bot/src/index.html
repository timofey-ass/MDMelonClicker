<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MDMelonClicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--surf:#17110d;--sc:#231a14;--sch:#2e241c;--pri:#ffb77c;--onpri:#4a2800;--prc:#6a3a12;--onprc:#ffdcc2;--on:#ede0d8;--onv:#d7c3b8;--out:#9f8d83;--gold:#ffd54f;--good:#9bd67f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--surf);color:var(--on);font-family:Roboto,"Google Sans",system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top)}
#top{display:flex;align-items:center;gap:8px;padding:10px 16px 6px}
#top h1{font-size:20px;font-weight:600;margin:0;flex:1;letter-spacing:.2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;background:var(--sch);color:var(--onv);font-size:12px;font-weight:600;white-space:nowrap}
.chip.p{background:var(--prc);color:var(--onprc)}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
#view::-webkit-scrollbar{display:none}
#nav{display:flex;background:var(--sc);padding:8px 4px calc(8px + env(safe-area-inset-bottom));gap:2px}
#nav button{flex:1;background:none;border:0;color:var(--onv);font:600 11px inherit;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;font-family:inherit;position:relative}
#nav .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
#nav button.on{color:var(--on)}
#nav button.on .pill{background:var(--prc);color:var(--onprc)}
.ic{flex:none;vertical-align:middle}.chip .ic,.btn .ic{margin:0 -1px}.star{width:44px;height:44px}
.card{background:var(--sc);border-radius:24px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:1px solid rgba(255,255,255,.04);position:relative;overflow:hidden}
.card.p{background:var(--prc);color:var(--onprc)}
.card.col{flex-direction:column;align-items:stretch;gap:6px}
.card.click{cursor:pointer}
.card.click:active{filter:brightness(1.2)}
.grow{flex:1;min-width:0}
.t1{font-size:15px;font-weight:600}
.t2{font-size:12px;color:var(--onv);margin-top:2px}
.card.p .t2{color:var(--onprc)}
.sec{font-size:13px;font-weight:700;color:var(--pri);margin:12px 4px 6px}
.circ{width:46px;height:46px;border-radius:50%;background:var(--prc);color:var(--onprc);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.btn{border:0;border-radius:22px;padding:0 18px;height:40px;font:600 14px inherit;font-family:inherit;background:var(--pri);color:var(--onpri);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;position:relative;overflow:hidden}
.btn.o{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 1px var(--out)}
.btn.t{background:var(--sch);color:var(--onv)}
.btn.dis{opacity:.45}
.btn:active{filter:brightness(1.15)}
.bar{height:10px;border-radius:5px;background:var(--sch);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--pri);transition:width .25s}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:2px 0}
.seg{display:flex;background:var(--sc);border-radius:22px;padding:4px;margin-bottom:10px}
.seg button{flex:1;height:36px;border:0;border-radius:18px;background:none;color:var(--onv);font:600 13px inherit;font-family:inherit}
.seg button.on{background:var(--prc);color:var(--onprc)}
.cat{background-image:url(/atlas.jpg);background-size:800% 800%;background-repeat:no-repeat;border-radius:22%;position:relative;overflow:hidden;flex:none}
.cat.h::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.38) 45%,rgba(120,220,255,.25) 52%,rgba(255,150,230,.25) 58%,transparent 70%);background-size:250% 100%;animation:sh 3s linear infinite;mix-blend-mode:screen}
@keyframes sh{0%{background-position:150% 0}100%{background-position:-100% 0}}
.cat.g::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 50% 70%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 80%,#fff 0 1px,transparent 2px);animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.2}to{opacity:1}}
#field{position:relative;height:340px;display:flex;align-items:center;justify-content:center;margin:6px 0}
#ring{position:absolute;width:268px;height:268px;border-radius:50%;border:3px solid var(--prc)}
#coin{width:240px;height:240px;border-radius:50%;transition:transform .1s;touch-action:manipulation;z-index:2}
#coin .cat{width:100%!important;height:100%!important;border-radius:50%}
.fl{position:absolute;left:50%;top:50%;font-weight:800;pointer-events:none;z-index:5;animation:fl .8s ease-out forwards;text-shadow:0 1px 4px #000}
@keyframes fl{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-190%)}}
.star{position:absolute;font-size:40px;z-index:6;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.ov{position:fixed;inset:0;background:rgba(23,17,13,.94);z-index:50;display:flex;flex-direction:column;align-items:center;padding:60px 16px 30px;overflow-y:auto}
.ov h2{margin:0 0 16px;font-size:20px}
.rv{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;margin-top:10px}
.cell{background:var(--sc);border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:700;text-align:center;position:relative}
.q{width:46px;height:46px;border-radius:50%;background:var(--sch);color:var(--out);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.sw{width:52px;height:32px;border-radius:16px;background:var(--sch);box-shadow:inset 0 0 0 2px var(--out);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:var(--out);transition:.2s}
.sw.on{background:var(--pri);box-shadow:none}
.sw.on::after{left:24px;top:4px;width:24px;height:24px;background:var(--onpri)}
input,textarea{background:var(--sch);border:0;border-radius:14px;color:var(--on);padding:12px 14px;font:15px inherit;font-family:inherit;width:100%;user-select:text;-webkit-user-select:text;outline:none}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--on);color:var(--surf);padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:99;max-width:86%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.s{opacity:1}
.hs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.hs::-webkit-scrollbar{display:none}
#load{position:fixed;inset:0;background:var(--surf);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#load .m{font-size:72px;animation:bn .9s ease-in-out infinite}
@keyframes bn{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-34px) rotate(8deg)}}
#load .tr{width:220px;height:6px;border-radius:3px;background:var(--sch);overflow:hidden;position:relative}
#load .tr i{position:absolute;top:0;height:100%;width:70px;border-radius:3px;background:var(--pri);animation:mv 1.2s ease-in-out infinite alternate}
@keyframes mv{from{left:0}to{left:150px}}
.rar0{color:#b0bec5}.rar1{color:#4fc3f7}.rar2{color:#ba68c8}.rar3{color:#ff5252}.rar4{color:#ffd740}.rar5{color:#1de9b6}

  async canceloff(e) { await save(true); const r = await api("cancel", {id: +e.dataset.i}); if (r.error) return toast(r.error); adopt(r); offData = null; toast("Предложение снято"); render(); },
  async accept(e) { const id = +e.dataset.i, o = offData.find(x => x.id === id); if (!o) return; if ((S.inv[o.want + ""] || 0) < 2) return toast("Нужен дубликат: " + ITEMS[o.want][1]); await save(true); const r = await api("accept", {id}); if (r.error) { toast(r.error); offData = null; render(); return; } adopt(r); checkAch(); mark(); offData = null; toast("Обмен состоялся!"); hap("ok"); render(); },
};
function adopt(r) { S = fixState(r.state); rev = r.rev; snap = cloneInv(); dirty = false; }

// ---------- coin / loop
function floatTxt(txt, color, size, x, y) { const f = $("#field"); if (!f) return; const e = document.createElement("div"); e.className = "fl"; e.textContent = txt; e.style.color = color; e.style.fontSize = size + "px"; e.style.marginLeft = (x !== undefined ? x : (Math.random() * 160 - 80)) + "px"; e.style.marginTop = (y !== undefined ? y : -100) + "px"; f.appendChild(e); setTimeout(() => e.remove(), 800); }

  const t = now(); let g = tapValue(); const crit = Math.random() < Math.min(.65, .05 + .03 * S.crit); if (crit) g *= 5;
  S.pts += g; S.run += g; S.total += g; S.taps++;
  if (t >= fever) { combo = Math.min(100, combo + 7); if (combo >= 100) { fever = t + 6 + S.fev; S.fevers++; toast("🔥 Лихорадка! x2"); hap("heavy"); } }
  hap(crit ? "medium" : "light"); floatTxt((crit ? "КРИТ +" : "+") + fmt(g), crit ? "#ffd54f" : "var(--on)", crit ? 26 : 20); mark();
}
document.addEventListener("pointerdown", e => { const c = e.target.closest("[data-coin]"); if (!c || busy || tab !== 0) return; e.preventDefault(); c.classList.add("pr"); c.style.transform = "scale(.92) rotate(" + (Math.random() * 10 - 5) + "deg)"; tap(); refresh(); });

function spawnStar() {
  const f = $("#field"); if (!f) return; const s = document.createElement("div"); s.className = "star"; s.innerHTML = ic("star", 44, "#ffd54f"); s.style.left = (20 + Math.random() * 60) + "%"; s.style.top = (10 + Math.random() * 70) + "%";
  s.onpointerdown = ev => { ev.stopPropagation(); S.stars++; if (Math.random() < .5) { const b = Math.max(100, cps() * 30, tapValue() * 50); S.pts += b; S.run += b; S.total += b; floatTxt("+" + fmt(b), "#ffd54f", 24, 0, 0); } else { frenzy = now() + 15; floatTxt("x3 на 15 с!", "#ffd54f", 24, 0, 0); } hap("ok"); checkAch(); mark(); s.remove(); };
  f.appendChild(s); setTimeout(() => s.remove(), 6000);
}
let last = now(), tickN = 0;
setInterval(() => {
  if (!S) return; const t = now(), dt = Math.min(1, t - last); last = t; tickN++;
  const inc = cps() * dt; S.pts += inc; S.run += inc; S.total += inc;
  if (t >= fever) combo = Math.max(0, combo - 22 * dt); else combo = 0;
  if (tickN % 10 === 0) checkAch();

  if (inc > 0) dirty = true;

  if (tickN % 150 === 0) save();
}, 100);

// ---------- server
async function api(path, body) {
  try { const r = await fetch("/api/" + path, {method: "POST", headers: {"content-type": "application/json", "x-init": tg ? tg.initData : ""}, body: JSON.stringify(body || {}), keepalive: path === "save"}); return await r.json(); }
  catch (e) { return {error: "Нет связи с сервером"}; }
}
async function save(force) {
  if (!S || saving || (!dirty && !force)) return; saving = true; S.ts = now();
  const r = await api("save", {rev, state: S}); saving = false;
  if (r.conflict) {
    const sv = r.state, m = Object.assign({}, sv.inv); for (const k in S.inv) { const d = (S.inv[k] || 0) - (snap.inv[k] || 0); m[k] = Math.max(0, (m[k] || 0) + d); }
    for (const k in snap.inv) if (!(k in S.inv)) m[k] = Math.max(0, (m[k] || 0) - snap.inv[k]);
    for (const k in m) if (m[k] <= 0) delete m[k];
    S.inv = m; S.holo = Array.from(new Set(S.holo.concat(sv.holo || []))).filter(i => (i + "") in m); rev = r.rev; snap = {inv: Object.assign({}, sv.inv)}; dirty = true; toast("Данные обновлены после обмена"); return save(true);
  }
  if (r.error) return; rev = r.rev; if (S) { dirty = false; snap = cloneInv(); }
}
async function loadTop() { const r = await api("top", {}); if (r.rows) { lbData = r; if (tab === 4 && sub === 0) render(); } else toast(r.error || "Не удалось загрузить"); }
async function loadOffers() { const r = await api("offers", {}); if (r.offers) { offData = r.offers; if (tab === 4 && sub === 1) render(); } else toast(r.error || "Не удалось загрузить"); }
async function decodeCode(code) {
  code = code.replace(/^\s*MDC1:/, "").replace(/\s+/g, "").replace(/-/g, "+").replace(/_/g, "/");
  const bin = atob(code), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  const ds = new DecompressionStream("deflate"), w = ds.writable.getWriter(); w.write(u); w.close();
  return JSON.parse(await new Response(ds.readable).text());
}
