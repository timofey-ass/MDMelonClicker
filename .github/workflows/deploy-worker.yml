name: Deploy worker
on:
  push:
    branches: [main]
    paths: ["bot/worker_small.js", "wrangler.jsonc"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Проверка настроек
        id: chk
        run: |
          if [ -z "$CF_TOKEN" ] || grep -q "ВСТАВЬ_ID" wrangler.jsonc; then echo "ok=no" >> $GITHUB_OUTPUT; echo "Деплой пропущен: нет секрета CLOUDFLARE_API_TOKEN или не вписан database_id"; else echo "ok=yes" >> $GITHUB_OUTPUT; fi
      - name: Deploy
        if: steps.chk.outputs.ok == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
