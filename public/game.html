A.admmod = async function (e) {

const modCard = () => `<div class="card col"><div class="t1" style="color:var(--pri);display:flex;align-items:center;gap:8px">${ic("crown", 18)}Модерация</div><div class="t2" style="font-size:13px;line-height:1.45;margin:0">Тебе выдали права помощника. Что можно:<br>• в чате удалять сообщения (крестик у сообщения);<br>• открыть профиль игрока и замутить или размутить его в чате;<br>• убрать неподходящий баннер игрока в его профиле.<br>Остальное доступно только владельцу.</div></div>`;

// ---------- АНАРХИЯ
const CH_N = {disco: "Диско", flip: "Вверх ногами", gold: "Золотой век", tiny: "Мелкий шрифт", night: "Ночь", shake: "Землетрясение", invert: "Негатив", blur: "Туман", mirror: "Зеркало", spin: "Карусель"};
let chaosCur = "";
function applyChaos(c) {
  let l = Array.isArray(c) ? c.slice() : c && c.mode ? [c] : []; if (isAn) for (const m of ["shake", "gold"]) if (!l.some(x => x.mode === m)) l.push({mode: m, by: "Анархия"}); const ms = l.map(x => x.mode).sort().join(","); if (ms === chaosCur) return;
  const had = chaosCur.split(","); chaosCur = ms;
  for (const k in CH_N) document.body.classList.toggle("ch-" + k, l.some(x => x.mode === k));
  l.forEach(x => { if (!had.includes(x.mode) && x.by !== "Анархия") toast("Режим «" + CH_N[x.mode] + "» от " + (x.by || "игрока")); });
}
// надписи в случайных местах + бредящий кот
let flKey = "";
function applyFloats(fl) {
  let box = document.getElementById("flbox");
  if (!isAn || !fl || !fl.length) { if (box) box.remove(); flKey = ""; return; }
  const key = fl.map(x => x.ts).join(","); if (key === flKey && box) return; flKey = key;
  if (!box) { box = document.createElement("div"); box.id = "flbox"; document.body.appendChild(box); }
  box.innerHTML = fl.map(x => { const r = Math.abs(Math.sin(x.ts * 12.9898) * 43758.5453) % 1, r2 = Math.abs(Math.sin(x.ts * 78.233) * 12345.678) % 1, r3 = Math.abs(Math.sin(x.ts * 3.17) * 999.1) % 1; return `<div class="flt" style="left:${4 + r * 62}%;top:${8 + r2 * 80}%;transform:rotate(${Math.round(r3 * 30 - 15)}deg)">${esc(x.text)}</div>`; }).join("");
}
const BREDS = ["Арбуз это ягода, а я нет", "Вчера я съел звук", "Тапай левой пяткой", "Мяу в квадрате", "Где мои носки из будущего?", "Я видел как монеты спят", "Кто украл вторник?", "Банан подозрительный", "Шшш, стены слушают", "Ку-ка-ре-мяу", "Я налоговый инспектор луны", "Нажми на меня трижды и ничего не будет", "Корка важнее мякоти", "Бип-буп, я тостер"];
let catT = 0;
function catSay() {
  let c = document.getElementById("brcat");
  if (!isAn) { if (c) c.remove(); return; }
  if (!c) { c = document.createElement("div"); c.id = "brcat"; c.innerHTML = `<div class="brb"></div><div class="bri"></div>`; c.querySelector(".bri").style.cssText = `background:url(${MAS_URL}) 0 0/256px 68px no-repeat`; c.onclick = () => { c.classList.remove("on"); }; document.body.appendChild(c); }
  c.style.left = (4 + Math.random() * 62) + "%"; c.style.top = (10 + Math.random() * 72) + "%";
  c.querySelector(".bri").style.backgroundPositionX = -64 * Math.floor(Math.random() * 4) + "px"; c.querySelector(".brb").textContent = BREDS[Math.floor(Math.random() * BREDS.length)]; c.classList.add("on");
  setTimeout(() => c.classList.remove("on"), 5000);
}
setInterval(() => { if (isAn && Math.random() < .6) catSay(); }, 9000);
let floatList = null;
function floatCard() {
  return `<div class="card col"><div class="t1" style="color:var(--pri)">Надпись в игре</div><div class="t2" style="font-size:12px;margin:0">Появится у всех в случайном месте экрана. Всего 10 надписей, новые вытесняют старые. Раз в 15 секунд.</div><input data-keep="flt" maxlength="60" placeholder="Любой текст">${btn("Выпустить надпись", "admfloat", 'style="width:100%;justify-content:center"')}${isAdm ? btn("Стереть все надписи", "admfloat", 'data-all="1"', "o") : ""}</div>`;
}

  const text = (KEEP.flt || "").trim(); if (!text) return toast("Напиши что-нибудь");
  const r = await api("adm_float", {text}); if (r && r.error) return toast(r.error); KEEP.flt = ""; toast("Надпись пошла");
};
let wallList = null;
async function loadWall() { const r = await api("adm_wall", {list: 1}); wallList = r && r.rows ? r.rows : []; if (tab === 5 && moreSub === 3) render(); }
function wallCard() {

  return `<div class="card col"><div class="t1" style="color:var(--pri)">Стена анархии</div><div class="t2" style="font-size:12px;margin:0">Короткая надпись, которую увидят все, у кого есть админка. Раз в 20 секунд.</div><input data-keep="wlt" maxlength="80" placeholder="Что написать на стене">${btn("Написать на стене", "admwall", 'style="width:100%;justify-content:center"')}${wallList && !rows ? '<div class="t2" style="text-align:center">Пока пусто</div>' : rows}</div>`;

A.admwall = async function () { const text = (KEEP.wlt || "").trim(); if (text.length < 2) return toast("Напиши что-нибудь"); const r = await api("adm_wall", {text}); if (r && r.error) return toast(r.error); KEEP.wlt = ""; toast("Написано"); loadWall(); };

A.admchaos = async function (e) { const r = await api("adm_chaos", {mode: e.dataset.m}); if (r && r.error) return toast(r.error); toast(e.dataset.m === "off" ? "Режим выключен" : "Режим включён"); };
const anInfo = () => `<div class="card col" style="border:1px solid var(--pri)"><div class="t1" style="color:var(--pri);display:flex;align-items:center;gap:8px">${ic("crown", 18)}АНАРХИЯ</div><div class="t2" style="font-size:13px;line-height:1.45;margin:0">Пока игра заморожена, у каждого игрока есть админка. Можно выдавать себе монеты (до 1Qa за раз) и любых котов, кроме админских, писать во все чаты бота, запускать события и режимы и оставлять надписи на стене.</div></div>`;
let anSt = null, anArm = "";
async function anLoad() { const r = await api("adm_anarchy_state", {}); anSt = r && !r.error ? r : {on: false, snap: 0}; if (tab === 5 && moreSub === 3) render(); }
function anOwnerCard() {
  if (!anSt) setTimeout(anLoad, 30); const s = anSt || {on: false, snap: 0};
  const sure = (k, txt) => anArm === k ? "Точно? Нажми ещё раз" : txt;

A.anarch = async function (e) {
  const k = e.dataset.k; if (anArm !== k) { anArm = k; render(); setTimeout(() => { if (anArm === k) { anArm = ""; if (tab === 5) render(); } }, 4000); return; }
  anArm = ""; const r = await api(k === "on" ? "adm_anarchy_on" : k === "off" ? "adm_anarchy_off" : "adm_anarchy_restore", k === "on" ? {cast: true} : {});
  if (r && r.error) toast(r.error); else toast(k === "on" ? "Анархия запущена, копия: " + r.snap + (r.cast ? ", рассылка пошла" : "") : k === "off" ? "Анархия выключена" : "Игра восстановлена: " + r.count);
  if (k === "restore") { isAn = false; }
  anSt = null; render();
};

setInterval(() => document.body.classList.toggle("an-casino", !!isAn && tab === 6), 400);

  return `<div class="card col" style="border:1px solid #e53935"><div class="t1" style="color:#ef5350">Жёсткая анархия</div><div class="t2" style="font-size:12px;margin:0">Действует на всех игроков. Дождь и котопад раз в 10 минут, грабёж раз в 2 минуты.</div>${btn("Золотой дождь: всем по 1 трлн", "admhard", 'data-k="rain" style="width:100%;justify-content:center"')}${btn("Котопад: всем по случайному коту", "admhard", 'data-k="catrain" style="width:100%;justify-content:center"', "o")}<input data-keep="stl" inputmode="numeric" placeholder="ID жертвы (смотри в топе или профиле)">${btn("Ограбить: забрать половину монет", "admhard", 'data-k="steal" style="width:100%;justify-content:center"', "o")}</div>`;
}

  const k = e.dataset.k, body = {kind: k}; if (k === "steal") { body.uid = +(KEEP.stl || 0); if (!body.uid) return toast("Впиши ID жертвы"); }

}, 1000);
